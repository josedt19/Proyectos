<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | FUTCTRL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">
    
    <!-- Navbar Superior -->
    <header class="border-b border-slate-800 bg-slate-950/70 sticky top-0 z-50 backdrop-blur">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-2xl font-black text-emerald-400 tracking-wider">FUTCTRL</a>
                <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-medium">BETA 1.0</span>
            </div>
            <nav class="hidden md:flex space-x-6 text-sm font-medium">
                <a href="index.html" class="text-slate-300 hover:text-emerald-300 transition">Inicio</a>
                <a href="carrera.html" class="text-slate-300 hover:text-emerald-300 transition">Modo Carrera</a>
                <a href="partidos.html" class="text-slate-300 hover:text-emerald-300 transition">Partidos</a>
                <a href="predicciones.html" class="text-slate-300 hover:text-emerald-300 transition">Predicciones</a>
                <a href="entrenador.html" class="text-slate-300 hover:text-emerald-300 transition">Entrenador</a>
                <a href="retos.html" class="text-slate-300 hover:text-emerald-300 transition">Retos</a>
                <a href="clasificacion.html" class="text-slate-300 hover:text-emerald-300 transition">Clasificación</a>
            </nav>
            <div class="flex items-center space-x-4">
                <a href="perfil.html" class="text-sm text-slate-300 hover:text-white transition">Perfil</a>
                <a href="admin.html" class="text-sm text-slate-300 hover:text-white transition">Admin</a>
                <a href="login.html" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition shadow-lg shadow-emerald-900/40">Entrar</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">
        
        <div class="bg-slate-800/40 border border-slate-700/60 p-6 rounded-2xl">
            <h1 class="text-2xl font-black text-white">⚙️ Panel de Control del Administrador</h1>
            <p class="text-slate-400 text-sm mt-1">Crea partidos de demostración, gestiona retos y resuelve resultados de pronósticos.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Crear Partido de Prueba -->
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 space-y-4">
                <h2 class="text-lg font-bold text-white">⚽ Crear / Editar Partido Demo</h2>
                <form onsubmit="alert('Partido de prueba creado en la base de datos!'); return false;" class="space-y-3 text-xs">
                    <div>
                        <label class="text-slate-400 block mb-1">Equipo Local:</label>
                        <input type="text" required placeholder="Ej. Real Demo CF" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-slate-200">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">Equipo Visitante:</label>
                        <input type="text" required placeholder="Ej. Atl. Ficticio" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-slate-200">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">Competición:</label>
                        <input type="text" value="Liga Demo FUTCTRL" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-slate-200">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg transition">
                        Guardar Partido
                    </button>
                </form>
            </div>

            <!-- Crear Reto Táctico -->
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 space-y-4">
                <h2 class="text-lg font-bold text-white">📋 Publicar Nuevo Reto Táctico</h2>
                <form onsubmit="alert('Reto publicado correctamente!'); return false;" class="space-y-3 text-xs">
                    <div>
                        <label class="text-slate-400 block mb-1">Título del Reto:</label>
                        <input type="text" required placeholder="Ej. Ajuste frente a 3-5-2" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-slate-200">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">Tipo de Reto:</label>
                        <select class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-slate-200">
                            <option>Táctica</option>
                            <option>Análisis</option>
                            <option>Jugadores</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">Puntuación Máxima:</label>
                        <input type="number" value="15" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-slate-200">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg transition">
                        Publicar Reto
                    </button>
                </form>
            </div>
        </div>

    </main>
</body>
</html>
